name: Deploy MkDocs to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install MkDocs
        run: pip install "mkdocs-material>=9.0,<10.0"

      - name: Prepare docs folder
        run: |
          mkdir -p docs
          cp -r 00_roadmap 01_ai_llm_basics 02_prompt_engineering 03_structured_outputs \
                04_llm_apis_backend 05_embeddings_semantic_search 06_rag 07_tool_calling \
                08_mcp 09_agents 10_evaluations 11_memory_context \
                12_finetuning_vs_rag_vs_prompting 13_safety_guardrails \
                14_production_deployment 15_frameworks_sdks 16_ai_architectures docs/
          cp index.md docs/

      - name: Deploy to GitHub Pages
        run: mkdocs gh-deploy --force
