name: Deploy MkDocs to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install MkDocs
        run: pip install "mkdocs-material>=9.0,<10.0"

      - name: Prepare content folder
        run: |
          mkdir -p content
          for dir in 00_roadmap 01_ai_llm_basics 02_llm_apis 03_memory_context \
                     04_prompt_engineering 05_structured_outputs 06_embeddings_search \
                     07_rag 08_tool_calling 09_mcp 10_agents 11_evaluations \
                     12_safety_guardrails 13_finetuning_vs_rag_vs_prompting \
                     14_frameworks_sdks 15_production 16_ai_architectures 17_projects \
                     assets resources; do
            [ -d "$dir" ] && cp -r "$dir" content/
          done
          cp index.md content/

      - name: Deploy to GitHub Pages
        run: mkdocs gh-deploy --force
